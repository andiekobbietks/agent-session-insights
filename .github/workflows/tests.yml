name: AgentSON adapter tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentson-beta-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt build twine
      - name: Install Chromium for report rendering tests
        run: python -m playwright install --with-deps chromium
      - name: Run complete test suite
        run: python -m unittest discover -s tests -v
      - name: Build wheel and source distribution
        run: |
          python -m build
          python -m twine check --strict dist/*
      - name: Check distribution contents
        run: python scripts/check_distribution.py
